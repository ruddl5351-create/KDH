<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전한 추석 만들기 · 점검 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
  background:linear-gradient(180deg,#131C33,#0E1526);
  color:#F2E3BE;
  font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  text-align:center;
}
.wrap{max-width:360px;width:100%}
.moon{
  width:120px;height:120px;border-radius:50%;margin:0 auto 26px;position:relative;
  background:radial-gradient(circle at 36% 32%,#FFFBEE 0%,#F2E3BE 55%,#DCC79A 100%);
  box-shadow:0 0 60px rgba(242,227,190,.25);
  display:flex;align-items:center;justify-content:center;
}
.moon svg{opacity:.5}
h1{font-family:'Gowun Batang',serif;font-size:27px;line-height:1.4;margin:0 0 16px;letter-spacing:-.02em}
p{font-size:15px;line-height:1.85;color:#C6CCDB;margin:0 0 10px}
.note{
  margin-top:26px;background:rgba(255,255,255,.05);
  border:1px solid rgba(242,227,190,.18);border-radius:14px;padding:16px;
  font-size:13.5px;line-height:1.8;color:#C6CCDB;
}
.note b{color:#C99A3B}
footer{margin-top:30px;font-size:12px;color:#8A93A8;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="moon">
    <svg width="60" height="60" viewBox="0 0 60 60">
      <ellipse cx="22" cy="14" rx="5" ry="13" fill="#8C7A4A"/>
      <ellipse cx="36" cy="15" rx="5" ry="12" fill="#8C7A4A"/>
      <circle cx="29" cy="38" r="15" fill="#8C7A4A"/>
    </svg>
  </div>
  <h1>잠시 점검 중입니다</h1>
  <p>더 나은 진행을 위해 게임을 손보고 있습니다.<br>조금 뒤에 다시 접속해 주세요.</p>
  <div class="note">
    이미 기록하신 <b>순위와 점수는 그대로 보관</b>되어 있습니다.<br>
    점검이 끝나면 같은 주소에서 이어서 참여하실 수 있습니다.
  </div>
  <footer>
    안전한 추석 만들기 · 안전 방탈출<br>
    한국산업인력공단 경북서부지사
  </footer>
</div>
</body>
</html>
